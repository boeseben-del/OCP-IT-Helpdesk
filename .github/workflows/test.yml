name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow psutil requests pytest pytest-cov pytest-mock requests-mock

      - name: Run tests
        env:
          HAPPYFOX_ENDPOINT: "https://test.happyfox.com/api/1.1/json/tickets/"
          HAPPYFOX_API_KEY: "ci-test-key"
          HAPPYFOX_AUTH_CODE: "ci-test-code"
          HAPPYFOX_CATEGORY: "Helpdesk - Colorado"
          HAPPYFOX_DEFAULT_EMAIL: "fallback@steadmanclinic.com"
          # Prevent psutil/pyautogui from needing a display
          DISPLAY: ""
        run: |
          python -m pytest -v --tb=short 2>&1
